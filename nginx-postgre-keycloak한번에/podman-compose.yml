version: '3.8'

networks:
  net-keycloak:
    driver: bridge

volumes:
  postgres_data:

services:
  # 1. PostgreSQL 데이터베이스
  postgres:
    image: docker.io/library/postgres:17.11-alpine3.23
    container_name: kc-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - net-keycloak
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Keycloak 노드 1
  keycloak-1:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: keycloak-1
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"       # 호스트 이름 엄격 검사 해제
      KC_HOSTNAME: "localhost"          # 외부에서 접근하는 주소 명시
      KC_HOSTNAME_PORT: "8080"          # 외부에서 접근하는 포트 명시
      KC_PROXY_HEADERS: "xforwarded"    # 프록시가 보내주는 헤더(X-Forwarded-For 등)를 신뢰하도록 설정
      JAVA_OPTS: "-Xms512m -Xmx1024m"   # JVM 메모리 상한선 제한 (OOM 방지)
    ports:
      - "8081:8080"  # Keycloak 노드 1의 포트를 호스트의 8081로 매핑
    command: ["start"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - net-keycloak

  # 3. Keycloak 노드 2
  keycloak-2:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: keycloak-2
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"       # 호스트 이름 엄격 검사 해제
      KC_HOSTNAME: "localhost"          # 외부에서 접근하는 주소 명시
      KC_HOSTNAME_PORT: "8080"          # 외부에서 접근하는 포트 명시
      KC_PROXY_HEADERS: "xforwarded"    # 프록시가 보내주는 헤더(X-Forwarded-For 등)를 신뢰하도록 설정
      JAVA_OPTS: "-Xms512m -Xmx1024m"   # JVM 메모리 상한선 제한 (OOM 방지)
    command: ["start"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - net-keycloak

  # 4. Keycloak 노드 3
  keycloak-3:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: keycloak-3
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"       # 호스트 이름 엄격 검사 해제
      KC_HOSTNAME: "localhost"          # 외부에서 접근하는 주소 명시
      KC_HOSTNAME_PORT: "8080"          # 외부에서 접근하는 포트 명시
      KC_PROXY_HEADERS: "xforwarded"    # 프록시가 보내주는 헤더(X-Forwarded-For 등)를 신뢰하도록 설정
      JAVA_OPTS: "-Xms512m -Xmx1024m"   # JVM 메모리 상한선 제한 (OOM 방지)
    command: ["start"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - net-keycloak

  # 5. Nginx 로드밸런서 (L4/L7 프록시)
  nginx:
    image: docker.io/library/nginx:alpine
    container_name: kc-nginx-lb
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:z
    depends_on:
      - keycloak-1
      - keycloak-2
      - keycloak-3
    networks:
      - net-keycloak