version: '3.8'

networks:
  net-keycloak1:
    driver: bridge

services:
  # Keycloak 노드 1
  keycloak-1:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: keycloak-1
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://192.168.0.131:5433,192.168.0.132:5433,192.168.0.133:5433/keycloak?targetServerType=primary&loadBalanceHosts=true
      #KC_DB_URL: jdbc:postgresql://192.168.0.131:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"       # 호스트 이름 엄격 검사 해제
      KC_HOSTNAME: "http://192.168.0.131:8080"
      #KC_HOSTNAME: "localhost"          # 외부에서 접근하는 주소 명시
      #KC_HOSTNAME: "192.168.0.130"          # 외부에서 접근하는 주소 명시
      #KC_HOSTNAME_PORT: "8080"          # 외부에서 접근하는 포트 명시
      KC_PROXY_HEADERS: "xforwarded"    # 프록시가 보내주는 헤더(X-Forwarded-For 등)를 신뢰하도록 설정
      
      KC_CACHE: ispn                                 # Infinispan 클러스터링 및 JGroups 통신 설정 (세션 공유 필수)
      KC_CACHE_STACK: jdbc-ping                      # 기본값이지만 명시
      KC_CACHE_EMBEDDED_CLUSTER_NAME: kuh-keycloak   # 3대 모두 동일, 다른 배포와는 달라야 함
      KC_CACHE_EMBEDDED_NETWORK_EXTERNAL_ADDRESS: 192.168.0.131
      KC_CACHE_EMBEDDED_NETWORK_EXTERNAL_PORT: "7800"

      # JVM 메모리 상한선 제한 (OOM 방지)
      JAVA_OPTS: "-Xms512m -Xmx1024m"
    ports:
      - "8080:8080"  # Keycloak 노드 1의 포트를 호스트의 8080로 매핑
      - "7800:7800"  # 노드 간 세션 동기화(JGroups) 포트
    networks:
      - net-keycloak1
    command: ["start"]