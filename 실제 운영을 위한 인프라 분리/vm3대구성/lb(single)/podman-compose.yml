version: '3.8'

networks:
  net-haproxy-lb:
    driver: bridge

services:
  haproxy-lb:
    image: docker.io/library/haproxy:lts-alpine3.24
    container_name: haproxy-lb
    restart: always
    networks:
      - net-haproxy-lb
    ports:
      - "8080:8080" # 외부에서 8080 포트로 접속 시 Keycloak 클러스터로 분산
      - "5432:5432" # 외부에서 5432 포트로 접속 시 현재 Primary PostgreSQL로 라우팅
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:z