# =====================================================================
# 글로벌 설정 (Global Configuration)
# =====================================================================
global
    # 로그 출력을 시스템 로거(syslog)로 전달하기 위한 설정
    # # 로컬 로그 출력 관련 에러 방지를 위해 syslog 주석 처리
    #log /dev/log local0
    
    # 기본 데몬 실행 모드 및 보안 관련 설정이 들어가는 영역입니다.

# =====================================================================
# 기본 설정 (Defaults Configuration)
# - 이후 선언되는 모든 프론트엔드/백엔드 블록에 공통으로 적용됩니다.
# =====================================================================
defaults
    log     global
    
    # TCP 모드 사용 (데이터베이스 같은 바이트 스트림 통신에 필수)
    # defaults에 mode를 강제 지정하면 http/tcp 프론트엔드가 꼬일 수 있으므로 제거
    #mode    tcp
    
    # TCP 패킷 전송 내역을 로그에 기록
    option  tcplog
    
    # 타임아웃 설정 (네트워크 지연 및 비정상 커넥션 차단 목적)
    timeout connect 5000ms  # 서버 연결 시도 대기 시간 (5초)
    timeout client  50000ms # 클라이언트 응답 대기 시간 (50초)
    timeout server  50000ms # 백엔드 서버 응답 대기 시간 (50초)

# =====================================================================
# 1. Keycloak 트래픽 부하분산 (HTTP L7 프록시)
# - 외부에서 8080 포트로 접속하는 요청을 받아 3대의 Keycloak 노드로 분산
# =====================================================================
frontend keycloak_front
    # 외부 요청을 수신할 HAProxy 내부 포트 (컨테이너 내부 80 포트와 바인딩)
    bind *:8080
    
    # HTTP 웹 트래픽 처리이므로 mode를 http로 설정
    mode http

    # HAProxy를 거쳐 백엔드로 갈 때 원본 호스트/포트 정보를 넘겨주도록 헤더 추가
    http-request set-header X-Forwarded-Host %[req.hdr(Host)]
    http-request set-header X-Forwarded-Port %[dst_port]
    http-request set-header X-Forwarded-Proto http
    
    # 트래픽을 넘겨줄 기본 백엔드 그룹 지정
    default_backend keycloak_cluster_back

backend keycloak_cluster_back
    mode http
    
    # 라운드로빈(Round-Robin) 방식으로 3대의 노드에 균등하게 트래픽 분산
    balance roundrobin
    
    # Keycloak의 준비 상태 점검 API를 이용한 헬스체크 활성화
    #option httpchk GET /health/ready
    option httpchk GET /
    
    # Keycloak은 루트 접근 시 로그인 페이지로 302 리다이렉트되므로 200 외에 302도 정상으로 인정
    http-check expect status 200,302
    
    # 헬스체크 주기 설정: 3초마다 검사(inter), 3번 실패하면 불량(fall), 2번 성공하면 복구(rise)
    default-server inter 3s fall 3 rise 2
    
    # Keycloak 3대 인스턴스 등록 (컨테이너 호스트의 포트 8081, 8082, 8083 매핑)
    server keycloak-1 192.168.0.130:8081 check
    server keycloak-2 192.168.0.130:8082 check
    server keycloak-3 192.168.0.130:8083 check

# =====================================================================
# 2. PostgreSQL 마스터 자동 라우팅 (TCP L4 프록시)
# - 외부에서 5430 포트로 접속 시, Patroni 상태를 체크하여 
#   현재 쓰기 가능한 '진짜 Primary(Master)' 노드로만 트래픽을 꽂아줌
# =====================================================================
frontend postgres_front
    # 외부 클라이언트(Keycloak, 앱 등)가 접근할 단일 DB 진입 포트
    bind *:5432
    
    # 데이터베이스 통신은 순수 TCP 바이트 스트림이므로 mode를 tcp로 설정
    mode tcp
    
    # 트래픽을 넘겨줄 백엔드 그룹 지정
    default_backend postgres_master_back

backend postgres_master_back
    mode tcp
    
    # Patroni REST API를 통해 현재 노드가 쓰기 권한이 있는 Primary인지 HTTP GET 요청으로 검사
    option httpchk GET /primary
    
    # Patroni API가 HTTP 200 OK를 반환하는 노드만 마스터(Primary)로 인정
    http-check expect status 200

    # 헬스체크에 실패(503 등)한 스탠바이 노드들은 백엔드 로테이션에서 즉시 제외합니다.
    # (이 옵션이 있어야 Primary인 노드 1대에게만 100% 트래픽이 꽂힙니다.)
    option allbackups
    
    # 헬스체크 주기: 3초마다 검사, 3회 연속 실패 시 장애 판정, 2회 연속 성공 시 복구
    default-server inter 3s fall 3 rise 2
    
    # [핵심] Patroni REST API 포트를 헬스체크에 활용하여 장애 발생 시 승격된 새로운 Primary 노드로 라우팅을 실시간 자동 전환함
    server pg-node-1 192.168.0.130:5433 maxconn 100 check port 8008
    server pg-node-2 192.168.0.130:5434 maxconn 100 check port 8009
    server pg-node-3 192.168.0.130:5435 maxconn 100 check port 8010
