! =====================================================================
! [Node-2] Keepalived 설정 (BACKUP 역할 - 1순위 예비군)
! =====================================================================
! 글로벌 설정 영역 (보안 경고 및 사용자 누락 에러 방지용)
global_defs {
    router_id lvs_node_2         ! 노드 식별자
    script_user root             ! 스크립트를 실행할 시스템 사용자 지정 (root 권한으로 실행)
    enable_script_security       ! 스크립트 실행 보안 검증 활성화 (SECURITY VIOLATION 경고 제거)
}

vrrp_script check_haproxy {
    script "/usr/bin/killall -0 haproxy"
    interval 2
    weight 2
}

vrrp_instance VI_1 {
    state BACKUP                 ! 초기 구동 시 백업 상태로 대기
    interface eth0               ! 통신용 네트워크 인터페이스
    virtual_router_id 51         ! 클러스터 식별 ID (모든 노드가 동일해야 함)
    priority 100                 ! 노드 우선순위 (Node1보다 낮은 100 부여)
    advert_int 1                 ! 하트비트 수신 주기 (1초)

    authentication {
        auth_type PASS
        auth_pass secret123      ! 노드1과 동일한 비밀번호 필수
    }

    virtual_ipaddress {
        192.168.0.130/24 dev eth0 ! 마스터 장애 시 이 노드가 이어받을 단일 진입점 VIP
    }

    track_script {
        check_haproxy
    }
}