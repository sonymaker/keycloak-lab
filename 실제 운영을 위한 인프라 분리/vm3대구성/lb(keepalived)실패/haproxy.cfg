# =====================================================================
# 글로벌 설정 (Global Configuration)
# - HAProxy 프로세스 전체에 영향을 미치는 시스템 수준의 설정 영역입니다.
# =====================================================================
global
    # 로그 출력을 표준 출력(stdout)으로 내보내어 컨테이너 로그(podman logs)로 확인할 수 있게 설정합니다.
    log stdout format raw local0

# =====================================================================
# 기본 설정 (Defaults Configuration)
# - 이후 선언되는 모든 프론트엔드(frontend) 및 백엔드(backend) 블록에 공통으로 적용됩니다.
# =====================================================================
defaults
    # 글로벌에 선언된 로깅 규칙을 기본으로 상속받아 사용합니다.
    log     global
    
    # TCP 모드 통신 내역을 로그에 상세히 기록하도록 옵션을 켭니다.
    option  tcplog
    
    # [타임아웃 설정] 네트워크 지연이나 비정상적인 커넥션 고착을 방지하기 위한 시간 제한입니다.
    timeout connect 5000ms  # 백엔드 서버와 연결을 맺을 때까지 기다리는 최대 대기 시간 (5초)
    timeout client  50000ms # 클라이언트로부터 요청을 기다리는 최대 대기 시간 (50초)
    timeout server  50000ms # 백엔드 서버가 응답을 돌려줄 때까지 기다리는 최대 대기 시간 (50초)

# =====================================================================
# HAProxy 상태 모니터링 통계 페이지 (Stats)
# - 웹브라우저로 HAProxy의 실시간 트래픽 및 백엔드 노드(UP/DOWN) 상태를 확인합니다.
# =====================================================================
listen stats
    bind *:7000             # 통계 페이지를 열기 위한 내부 포트 (http://localhost:7000 접속용)
    mode http               # 웹 브라우저 접속이므로 HTTP 모드로 설정
    stats enable            # 통계 기능 활성화
    stats uri /             # 루트 경로(/)로 접속 시 통계 페이지가 바로 뜨도록 설정
    stats refresh 3s        # 페이지를 3초마다 자동으로 새로고침

# =====================================================================
# 1. Keycloak 트래픽 부하분산 (HTTP L7 프록시)
# - 외부에서 8080 포트로 들어오는 웹/인증 요청을 받아 3대의 Keycloak 노드로 분산합니다.
# =====================================================================
frontend keycloak_front
    bind *:8080             # 외부 요청을 수신할 HAProxy 진입 포트
    mode http               # 웹(HTTP/HTTPS) 트래픽 처리이므로 http 모드 사용
    
    # 역방향 프록시(Reverse Proxy) 환경에서 클라이언트의 원본 호스트 및 프로토콜 정보를 백엔드로 전달합니다.
    http-request set-header X-Forwarded-Host %[req.hdr(Host)]
    http-request set-header X-Forwarded-Port %[dst_port]
    http-request set-header X-Forwarded-Proto http
    
    # 수신된 트래픽을 넘겨줄 실제 백엔드 그룹 지정
    default_backend keycloak_cluster_back

backend keycloak_cluster_back
    mode http               # 백엔드 서버와의 통신도 HTTP 모드 유지
    balance roundrobin      # 라운드로빈(Round-Robin) 알고리즘을 사용하여 3대의 노드에 균등하게 트래픽 분산
    
    # Keycloak 헬스체크: 루트 경로(/)로 HTTP GET 요청을 보내 정상 응답을 확인합니다.
    option httpchk GET /
    # Keycloak은 루트 접속 시 로그인 페이지로 302 리다이렉트되므로 200 외에 302도 정상 상태로 인정합니다.
    http-check expect status 200,302
    
    # 헬스체크 주기: 3초마다 검사(inter 3s), 3번 연속 실패 시 다운 판정(fall 3), 2번 연속 성공 시 복구(rise 2)
    default-server inter 3s fall 3 rise 2
    
    # Keycloak 클러스터 노드 3대 등록 (컨테이너 호스트 내부의 8081, 8082, 8083 포트 매핑)
    server keycloak-1 192.168.0.130:8081 check
    server keycloak-2 192.168.0.130:8082 check
    server keycloak-3 192.168.0.130:8083 check

# =====================================================================
# 2. PostgreSQL 마스터 자동 라우팅 (TCP L4 프록시)
# - 외부에서 5432 포트로 접속 시, Patroni 상태를 실시간 체크하여 
#   현재 쓰기 가능한 '진짜 Primary(Master)' 노드로만 트래픽을 안전하게 꽂아줍니다.
# =====================================================================
frontend postgres_front
    bind *:5432             # 데이터베이스 클라이언트(Keycloak 등)가 접근할 단일 DB 진입 포트
    mode tcp                # 순수 바이트 스트림 통신(TCP)이므로 tcp 모드 사용
    default_backend postgres_master_back

backend postgres_master_back
    mode tcp
    
    # Patroni REST API(포트 8008)를 통해 현재 노드가 쓰기 권한이 있는 Primary인지 HTTP GET 요청으로 검사합니다.
    option httpchk GET /primary
    # Patroni API가 HTTP 200 OK를 반환하는 노드만 마스터(Primary)로 인정합니다.
    http-check expect status 200
    
    # 헬스체크에 실패(503 등)하여 스탠바이 상태가 된 노드들은 로테이션에서 즉시 제외합니다.
    # (이 옵션이 있어야 Primary인 단 1대의 노드에게만 100% 트래픽이 집중됩니다.)
    option allbackups
    
    # 헬스체크 주기: 3초마다 검사, 3회 연속 실패 시 장애 판정, 2회 연속 성공 시 복구
    default-server inter 3s fall 3 rise 2
    
    # [핵심] PostgreSQL 실제 데이터 포트(5433~5435)로 트래픽을 보내되, 
    # 헬스체크는 Patroni REST API 포트(8008)를 타겟으로 삼아 승격/장패오버를 실시간 감지합니다.
    server pg-node-1 192.168.0.130:5433 maxconn 100 check port 8008
    server pg-node-2 192.168.0.130:5434 maxconn 100 check port 8008
    server pg-node-3 192.168.0.130:5435 maxconn 100 check port 8008