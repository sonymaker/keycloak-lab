! =====================================================================
! [Node-1] Keepalived 설정 (MASTER 역할)
! =====================================================================
! 글로벌 설정 영역 (보안 경고 및 사용자 누락 에러 방지용)
global_defs {
    router_id lvs_node_1         ! 노드 식별자
    script_user root             ! 스크립트를 실행할 시스템 사용자 지정 (root 권한으로 실행)
    enable_script_security       ! 스크립트 실행 보안 검증 활성화 (SECURITY VIOLATION 경고 제거)
}

! 1. 헬스체크 스크립트 정의: 로컬에 HAProxy 프로세스가 정상 살아있는지 주기적으로 검사
vrrp_script check_haproxy {
    script "/usr/bin/killall -0 haproxy"  ! 프로세스 존재 여부 확인 명령어 (0을 리턴하면 정상)
    interval 2                   ! 체크 주기를 2초마다 실행
    weight 2                     ! 스크립트 성공 시 가중치 부여 (장애 시 우선순위 하락용)
}

! 2. VRRP(가상 Router) 인스턴스 설정
vrrp_instance VI_1 {
    state MASTER                 ! 초기 구동 시 MASTER 상태 선언 (우선순위가 가장 높아 대장으로 선출됨)
    interface eth0               ! 가상 IP(VIP)를 할당하고 VRRP 패킷을 주고받을 컨테이너 내부 네트워크 카드
    virtual_router_id 51         ! 클러스터 식별 ID (동일 네트워크 내의 모든 노드가 반드시 같은 번호여야 함)
    priority 101                 ! 노드 우선순위 (숫자가 높을수록 대장이 될 확률이 높음. Node1은 101)
    advert_int 1                 ! 마스터가 살아있음을 알리는 하트비트 전송 주기 (1초)

    ! 노드 간 통신 인증 설정 (클러스터 참여 노드 간 패킷 암호화/인증용)
    authentication {
        auth_type PASS           ! 패스워드 인증 방식 사용
        auth_pass secret123      ! 클러스터 공유 비밀번호
    }

    ! 공유할 단일 가상 IP (VIP) 설정
    virtual_ipaddress {
        192.168.0.130/24 dev eth0 ! 클라이언트가 접속할 단일 진입점 IP (서버 자체 IP인 192.168.0.130 사용)
    }

    ! 앞서 정의한 헬스체크 스크립트를 이 인스턴스에 연동
    track_script {
        check_haproxy
    }
}